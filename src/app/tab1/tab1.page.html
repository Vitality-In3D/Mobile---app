<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Počítadlo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Počítadlo</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Reusable counter component -->
  <app-counter heading="Nové počítadlo" (saved)="onSaved($event)"></app-counter>
</ion-content>
